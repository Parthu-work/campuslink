packages:
  - apps/*
  - packages/*
onlyBuiltDependencies:
  - argon2
  - esbuild
  - sharp
  - msgpackr-extract
overrides:
  # autocannon (load test, dev only) → hyperid pins uuid 8 (GHSA-w5hq-g745-h8pq); 11 keeps CommonJS.
  'hyperid>uuid': ^11.1.1
  # Transitive security fixes (CI's pnpm audit): express 5.3 → body-parser 2.3 (GHSA, DoS) and
  # @hookform/resolvers → ajv → fast-uri 3.1.8 (URI parsing). Drop once the parents require them.
  'body-parser@<2.4.0': ^2.4.0
  'fast-uri@<3.1.9': ^3.1.9
  # Build-time only (vite-plugin-pwa → workbox-build → @rollup/plugin-terser): GHSA, low.
  'serialize-javascript@<7.1.3': ^7.1.4
