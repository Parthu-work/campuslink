<title>CampusLink Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400..700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Telugu:wght@400..700&display=swap">
<style>
/* Layout concept: "Night campus" — a blue-ink sky; landing is full-bleed, the app is a 3-column shell on desktop and a bottom-nav stack on phones. */
:root {
  /* dark-first ground */
  --bg: #070a14; --surface-1: #0d1222; --surface-2: #141b30; --surface-3: #1c2540;
  --line: rgba(170, 190, 255, .11); --line-strong: rgba(170, 190, 255, .22);
  --fg: #eef1fa; --fg-2: #a6afc8; --fg-3: #8189a5;
  --glass: rgba(13, 18, 34, .72); --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 12px 32px rgba(0,0,0,.35);
  --success: #3dd598; --warning: #f5b546; --danger: #ff6b81;
  --on-brand: #06101c;
  /* tenant: Deccan Plateau Institute of Technology (default) */
  --brand: #3fb8e6; --brand-2: #6d5ae6; --accent: #f2b705;
  --brand-ink-d: #6ccbf0; --accent-ink-d: #f7c843; --brand-ink-l: #0a6890; --accent-ink-l: #855f00;
  --brand-ink: var(--brand-ink-d); --accent-ink: var(--accent-ink-d);
  /* type */
  --f-display: 'Bricolage Grotesque', 'Noto Sans Telugu', ui-sans-serif, system-ui, sans-serif;
  --f-body: 'Figtree', 'Noto Sans Telugu', ui-sans-serif, system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  /* shape & motion */
  --r-sm: 10px; --r-md: 16px; --r-lg: 24px; --r-pill: 999px;
  --m: 1; --spring: cubic-bezier(.22, 1.2, .36, 1); --out: cubic-bezier(.2, .8, .2, 1);
  --t-fast: calc(140ms * var(--m)); --t-base: calc(260ms * var(--m));
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f5fa; --surface-1: #ffffff; --surface-2: #e9edf6; --surface-3: #dde3f0;
    --line: rgba(20, 30, 70, .12); --line-strong: rgba(20, 30, 70, .24);
    --fg: #0c1226; --fg-2: #444e69; --fg-3: #5b6480;
    --glass: rgba(255, 255, 255, .78); --shadow: 0 1px 2px rgba(15,25,60,.06), 0 10px 28px rgba(15,25,60,.08);
    --success: #0f8a5f; --warning: #a35f00; --danger: #c22745;
    --brand-ink: var(--brand-ink-l); --accent-ink: var(--accent-ink-l);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f5fa; --surface-1: #ffffff; --surface-2: #e9edf6; --surface-3: #dde3f0;
  --line: rgba(20, 30, 70, .12); --line-strong: rgba(20, 30, 70, .24);
  --fg: #0c1226; --fg-2: #444e69; --fg-3: #5b6480;
  --glass: rgba(255, 255, 255, .78); --shadow: 0 1px 2px rgba(15,25,60,.06), 0 10px 28px rgba(15,25,60,.08);
  --success: #0f8a5f; --warning: #a35f00; --danger: #c22745;
  --brand-ink: var(--brand-ink-l); --accent-ink: var(--accent-ink-l);
  color-scheme: light;
}
/* tenant: Musi Riverfront College of Engineering */
:root[data-tenant="mrce"] {
  --brand: #22b07d; --brand-2: #0e7c86; --accent: #ff7a59;
  --brand-ink-d: #4fd39f; --accent-ink-d: #ff9a80; --brand-ink-l: #066b4b; --accent-ink-l: #a93a1c;
}
:root[data-motion="reduce"] { --m: 0; }
@media (prefers-reduced-motion: reduce) { :root:not([data-motion="full"]) { --m: 0; } }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font: 400 15px/1.55 var(--f-body);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
:root[lang="te"] body { line-height: 1.68; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--brand-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
[tabindex="-1"]:focus { outline: none; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font: 500 11px/1.2 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--fg-3); }
.muted { color: var(--fg-2); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ── buttons & chips ───────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border-radius: var(--r-pill);
  border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--fg);
  font-weight: 600; font-size: 14px; white-space: nowrap;
  transition: transform var(--t-fast) var(--out), background var(--t-fast);
}
.btn:hover { background: var(--surface-3); }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--brand); border-color: transparent; color: var(--on-brand); }
.btn-primary:hover { background: color-mix(in srgb, var(--brand) 88%, white); }
.btn-accent { background: var(--accent); border-color: transparent; color: var(--on-brand); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--surface-2); }
.btn-sm { min-height: 36px; padding: 0 14px; font-size: 13px; }
.btn-lg { min-height: 54px; padding: 0 26px; font-size: 16px; }
.icon-btn { width: 44px; padding: 0; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px;
  border-radius: var(--r-pill); border: 1px solid var(--line-strong); background: transparent;
  font-size: 13px; font-weight: 500; color: var(--fg-2);
  transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast), transform var(--t-fast) var(--spring);
}
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--brand) 18%, transparent); border-color: var(--brand); color: var(--fg); }
.chip:active { transform: scale(.95); }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--r-pill); font: 500 11px/1.6 var(--f-mono); background: var(--surface-2); color: var(--fg-2); }
.tag-brand { background: color-mix(in srgb, var(--brand) 16%, transparent); color: var(--brand-ink); }
.tag-accent { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent-ink); }
.tag-warn { background: color-mix(in srgb, var(--warning) 16%, transparent); color: var(--warning); }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i-sm { width: 16px; height: 16px; }

/* ── avatar ───────────────────────────── */
.av {
  --h: 200; flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%;
  background: linear-gradient(135deg, hsl(var(--h) 70% 55%), hsl(calc(var(--h) + 60) 65% 42%));
  color: #fff; font: 700 15px/1 var(--f-display); position: relative; letter-spacing: .02em;
}
.av-sm { width: 32px; height: 32px; font-size: 12px; }
.av-lg { width: 88px; height: 88px; font-size: 30px; }
.av .tick { position: absolute; right: -2px; bottom: -2px; width: 16px; height: 16px; border-radius: 50%; background: var(--brand); border: 2px solid var(--surface-1); display: grid; place-items: center; }
.av .tick svg { width: 9px; height: 9px; stroke: var(--on-brand); stroke-width: 3.5; fill: none; }
.av-lg .tick { width: 26px; height: 26px; border-width: 3px; }
.av-lg .tick svg { width: 13px; height: 13px; }

/* ── prototype controls ───────────────────────────── */
.proto-toggle {
  position: fixed; z-index: 90; top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px));
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: var(--r-pill);
  background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line-strong); font: 500 12px var(--f-mono); color: var(--fg);
}
.proto-panel {
  position: fixed; z-index: 91; top: calc(54px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px));
  width: min(320px, calc(100vw - 20px)); padding: 16px; border-radius: var(--r-lg);
  background: var(--surface-1); border: 1px solid var(--line-strong); box-shadow: var(--shadow);
  display: grid; gap: 14px;
}
.proto-panel label { display: grid; gap: 6px; font-size: 12px; color: var(--fg-2); }
.proto-panel select { min-height: 40px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--surface-2); padding: 0 10px; }
.proto-panel .screens { display: flex; flex-wrap: wrap; gap: 6px; }
.proto-panel .note { font-size: 12px; color: var(--fg-3); line-height: 1.45; }

/* ── screens ───────────────────────────── */
.screen { animation: screenIn calc(380ms * var(--m)) var(--out) both; }
@keyframes screenIn { from { opacity: 0; transform: translateY(calc(10px * var(--m))); } }

/* landing */
#landing { position: relative; min-height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto; overflow: hidden; isolation: isolate; }
#mesh { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; filter: saturate(1.15); }
#landing::after { content: ''; position: absolute; inset: 0; z-index: -1; background: radial-gradient(120% 80% at 50% 110%, var(--bg) 25%, transparent 70%), linear-gradient(to bottom, color-mix(in srgb, var(--bg) 30%, transparent), transparent 40%); }
.l-top { display: flex; align-items: center; gap: 12px; padding-block: calc(18px + env(safe-area-inset-top, 0px)) 0; padding-right: 130px !important; }
.crest { width: 40px; height: 40px; flex: none; }
.l-college { font: 600 14px/1.25 var(--f-display); }
.l-college small { display: block; font: 400 11px var(--f-mono); color: var(--fg-2); letter-spacing: .06em; }
.l-hero { align-self: center; display: grid; gap: 22px; max-width: 760px; padding-block: 40px 28px; }
.l-hero h1 { font-size: clamp(38px, 7.2vw, 76px); line-height: .98; font-weight: 750; font-variation-settings: 'opsz' 96; letter-spacing: -.035em; }
.l-hero h1 em { font-style: normal; background: linear-gradient(100deg, var(--brand-ink), var(--accent-ink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
:root[lang="te"] .l-hero h1 { font-size: clamp(30px, 5.4vw, 56px); line-height: 1.25; letter-spacing: 0; }
.l-hero p { font-size: clamp(16px, 2vw, 19px); color: var(--fg-2); max-width: 54ch; }
.l-cta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.wall { display: grid; gap: 12px; min-width: 0; overflow: hidden; padding-block: 8px 28px; mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
.wall-row { display: flex; gap: 12px; width: max-content; animation: drift calc(70s / max(var(--m), .0001)) linear infinite; }
.wall-row:nth-child(2) { animation-direction: reverse; animation-duration: calc(85s / max(var(--m), .0001)); }
:root[data-motion="reduce"] .wall-row { animation: none; }
@media (prefers-reduced-motion: reduce) { :root:not([data-motion="full"]) .wall-row { animation: none; } }
@keyframes drift { to { transform: translateX(-50%); } }
.wcard { display: flex; align-items: center; gap: 10px; padding: 10px 16px 10px 10px; border-radius: var(--r-md); background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); min-width: 230px; }
.wcard b { display: block; font-size: 14px; }
.wcard span { font-size: 12px; color: var(--fg-2); }
.l-foot { font-size: 12px; color: var(--fg-3); padding-block: 0 calc(16px + env(safe-area-inset-bottom, 0px)); }

/* onboarding */
#onboard { min-height: 100%; display: grid; place-items: start center; padding-block: calc(64px + env(safe-area-inset-top, 0px)) 40px; }
.ob { width: 100%; max-width: 560px; display: grid; gap: 24px; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.steps span { height: 4px; border-radius: 4px; background: var(--surface-3); position: relative; overflow: hidden; }
.steps span::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, var(--brand), var(--accent)); transform: scaleX(0); transform-origin: left; transition: transform calc(500ms * var(--m)) var(--out); }
.steps span.on::after { transform: scaleX(1); }
.ob h2 { font-size: clamp(28px, 5vw, 38px); line-height: 1.05; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; }
.field .hint { font-size: 12px; color: var(--fg-3); }
.input { min-height: 50px; border-radius: var(--r-md); border: 1px solid var(--line-strong); background: var(--surface-1); padding: 0 16px; font-size: 16px; width: 100%; }
textarea.input { padding: 12px 16px; min-height: 88px; resize: vertical; }
.input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 22%, transparent); }
.otp { display: flex; gap: 8px; }
.otp input { width: 100%; max-width: 52px; aspect-ratio: 1 / 1.15; text-align: center; font: 600 22px var(--f-mono); border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--surface-1); }
.otp input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 22%, transparent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.follow-list { display: grid; gap: 8px; }
.follow-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r-md); background: var(--surface-1); border: 1px solid var(--line); }
.follow-row > div { flex: 1; min-width: 0; }
.follow-row b { display: block; font-size: 14px; }
.follow-row small { color: var(--fg-2); font-size: 12px; }
.src-ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--accent-ink); flex: none; }
.ob-actions { display: flex; justify-content: space-between; gap: 10px; }
.done-stage { position: relative; display: grid; place-items: center; text-align: center; gap: 14px; padding-block: 20px; }
.done-stage canvas { width: 100%; max-width: 360px; aspect-ratio: 1; }
.done-stage h2 { margin-top: -40px; }

/* app shell */
#app { min-height: 100%; display: grid; grid-template-columns: 1fr; }
.rail { display: none; }
.aside { display: none; }
.main { min-width: 0; padding-block: calc(60px + env(safe-area-inset-top, 0px)) calc(96px + env(safe-area-inset-bottom, 0px)); }
.topbar {
  position: fixed; z-index: 40; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px;
  padding-block: calc(8px + env(safe-area-inset-top, 0px)) 8px; padding-right: 130px !important;
  background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--line);
}
.topbar .crest { width: 32px; height: 32px; }
.topbar b { font: 650 16px var(--f-display); }
.bottomnav {
  position: fixed; z-index: 40; left: 0; right: 0; bottom: 0;
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line);
}
.nav-btn { display: grid; justify-items: center; gap: 2px; min-height: 52px; padding: 6px 2px; border: 0; background: none; border-radius: var(--r-sm); color: var(--fg-3); font-size: 11px; font-weight: 600; position: relative; }
.nav-btn[aria-current="page"] { color: var(--fg); }
.nav-btn[aria-current="page"] svg { stroke: var(--brand-ink); }
.nav-btn[aria-current="page"]::before { content: ''; position: absolute; top: 0; width: 22px; height: 3px; border-radius: 3px; background: var(--brand); }
.content { max-width: 680px; margin: 0 auto; display: grid; gap: 16px; padding-block: 12px; }

@media (min-width: 1024px) {
  #app { grid-template-columns: 240px minmax(0, 1fr) 320px; }
  .topbar, .bottomnav { display: none; }
  .main { padding-block: 24px 48px; }
  .rail { display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; padding: 20px 14px; border-right: 1px solid var(--line); }
  .rail .brand-row { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; }
  .rail .brand-row b { font: 650 15px/1.2 var(--f-display); }
  .rail .nav-btn { grid-template-columns: 24px 1fr; justify-items: start; align-items: center; gap: 12px; padding: 0 12px; min-height: 46px; font-size: 14px; }
  .rail .nav-btn:hover { background: var(--surface-2); color: var(--fg); }
  .rail .nav-btn[aria-current="page"] { background: var(--surface-2); }
  .rail .nav-btn[aria-current="page"]::before { top: 12px; bottom: 12px; left: 0; width: 3px; height: auto; }
  .rail .kbd-hint { margin-top: auto; }
  .aside { display: flex; flex-direction: column; gap: 16px; padding: 64px 20px 24px; border-left: 1px solid var(--line); position: sticky; top: 0; height: 100vh; overflow-y: auto; }
}
.kbd-hint { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 0 12px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-1); color: var(--fg-2); font-size: 13px; }
kbd { font: 500 11px var(--f-mono); padding: 2px 6px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--fg-2); }
.kbd-hint kbd { margin-left: auto; }

.card { background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--r-md); }
.panel { padding: 16px; display: grid; gap: 12px; }
.panel h3 { font-size: 15px; }
.person { display: flex; align-items: center; gap: 12px; }
.person > div { flex: 1; min-width: 0; }
.person b { display: block; font-size: 14px; line-height: 1.3; }
.person small { display: block; font-size: 12px; color: var(--fg-2); line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* feed */
.seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: var(--r-pill); background: var(--surface-1); border: 1px solid var(--line); }
.seg button { position: relative; z-index: 1; min-height: 40px; border: 0; background: none; border-radius: var(--r-pill); font-weight: 600; font-size: 14px; color: var(--fg-2); }
.seg button[aria-selected="true"] { color: var(--on-brand); }
.seg .ind { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: var(--r-pill); background: var(--brand); transition: transform var(--t-base) var(--spring); }
.seg[data-i="1"] .ind { transform: translateX(100%); }
.stories { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 6px; scrollbar-width: none; }
.stories::-webkit-scrollbar { display: none; }
.story { flex: none; display: grid; justify-items: center; gap: 6px; width: 72px; border: 0; background: none; padding: 0; font-size: 11px; color: var(--fg-2); text-align: center; line-height: 1.25; }
.story .ring { width: 66px; height: 66px; border-radius: 50%; padding: 3px; background: conic-gradient(from 200deg, var(--brand), var(--brand-2), var(--accent), var(--brand)); display: grid; place-items: center; }
.story .ring > span { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 3px solid var(--bg); color: var(--accent-ink); }
.story.seen .ring { background: var(--line-strong); }

.out { position: relative; overflow: hidden; padding: 18px; display: grid; gap: 10px; border-radius: var(--r-lg); background: radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 55%), var(--surface-1); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); }
.out .eyebrow { color: var(--accent-ink); display: flex; align-items: center; gap: 8px; }
.out h3 { font-size: 20px; line-height: 1.2; }
.out .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.post { padding: 16px; display: grid; gap: 12px; }
.post-head { display: flex; gap: 12px; align-items: center; }
.post-head > div { flex: 1; min-width: 0; }
.post-head b { font-size: 14px; }
.post-head small { display: block; font-size: 12px; color: var(--fg-2); }
.post-body { font-size: 15px; display: grid; gap: 8px; }
.post-body ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.post-actions { display: flex; gap: 4px; margin: 0 -8px -6px; }
.react { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 10px; border: 0; background: none; border-radius: var(--r-pill); color: var(--fg-2); font-size: 13px; font-weight: 600; }
.react:hover { background: var(--surface-2); color: var(--fg); }
.react[aria-pressed="true"] { color: var(--accent-ink); }

  const steps = [1, 2, 3, 4].map((i) => `<span class="${i <= S.ob ? 'on' : ''}"></span>`).join('');
  let body = '';
  if (S.ob === 1) body = `
    <h2>${esc(t('ob.1'))}</h2>
    <p class="muted">We match your roll number against the list your college gave us, then send a one-time code to the email on record. No college ID photo needed unless this fails.</p>
    <div class="field"><label for="roll">Roll number</label><input class="input mono" id="roll" value="${TENANTS[S.tenant].roll}" autocomplete="off" spellcheck="false"><span class="hint">Found: <b>Ananya K.</b> · CSE · Batch 2025 · code sent to a••••@${S.tenant}.edu.in (demo)</span></div>
    <div class="field"><label for="otp0">6-digit code</label><div class="otp" role="group" aria-label="One-time code">${[0, 1, 2, 3, 4, 5].map((i) => `<input id="otp${i}" inputmode="numeric" maxlength="1" aria-label="Digit ${i + 1}" autocomplete="${i ? 'off' : 'one-time-code'}">`).join('')}</div><span class="hint">Any 6 digits work in this prototype. Codes expire in 10 minutes.</span></div>
    <label style="display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--fg-2)"><input type="checkbox" id="age" checked style="margin-top:3px"> I am 18 or older and agree to the privacy notice. I can withdraw consent for each purpose any time in Settings.</label>`;
  if (S.ob === 2) body = `
    <h2>${esc(t('ob.2'))}</h2>
    <div class="field"><span class="eyebrow">Branch</span><div class="chips" data-single="branch">${['CSE', 'IT', 'ECE', 'EEE', 'MECH', 'CIVIL', 'CHEM'].map((b) => `<button class="chip" aria-pressed="${S.branch === b}" data-val="${b}">${b}</button>`).join('')}</div></div>
    <div class="field"><span class="eyebrow">Interests (pick a few)</span><div class="chips" data-multi="interests">${['Backend', 'Frontend', 'DSA', 'Data', 'ML & AI', 'DevOps', 'Cybersecurity', 'UI/UX', 'GATE', 'PSU jobs', 'Higher studies', 'Internships', 'Govt exams'].map((b) => `<button class="chip" aria-pressed="${S.interests.has(b)}" data-val="${esc(b)}">${esc(b)}</button>`).join('')}</div></div>`;
  if (S.ob === 3) body = `
    <h2>${esc(t('ob.3'))}</h2>
    <p class="muted">Picked from your branch and interests. Your feed fills from what you follow.</p>
    <div class="follow-list">
      ${ALUMNI.slice(0, 4).map((a) => `<div class="follow-row">${av(a.name, '', true)}<div><b>${esc(a.name)}</b><small>${esc(a.role)} · ${esc(a.co)} · <span class="mono">${a.branch} '${String(a.batch).slice(2)}</span></small></div><button class="chip" data-follow="${a.id}" aria-pressed="${S.follows.has(a.id)}">${S.follows.has(a.id) ? 'Following' : 'Follow'}</button></div>`).join('')}
      ${[['src-jobs', 'Fresher jobs', 'Openings filtered for 0–1 years', 'radar'], ['src-tech', 'Tech news', 'Snippets from reputable feeds, linked to source', 'rss'], ['src-exam', 'Exam notifications', 'GATE, PSU and state exams from official sites', 'cal']].map(([id, n, d, i]) => `<div class="follow-row"><span class="src-ico">${ico(i)}</span><div><b>${n}</b><small>${d}</small></div><button class="chip" data-follow="${id}" aria-pressed="${S.follows.has(id)}">${S.follows.has(id) ? 'Following' : 'Follow'}</button></div>`).join('')}
    </div>`;
  if (S.ob === 4) body = `
    <div class="done-stage"><canvas id="burst" width="360" height="360" aria-hidden="true"></canvas>
      <h2>${esc(t('ob.4'))}</h2>
      <p class="muted">You follow <b class="mono">${S.follows.size}</b> people and sources. Your feed is ready and your first star is lit.</p>
    </div>`;
  const next = S.ob === 4 ? `<button class="btn btn-primary btn-lg" data-go="feed" style="width:100%">Open my feed ${ico('arrow')}</button>`
    : `<div class="ob-actions"><button class="btn btn-ghost" data-ob="back">${ico('back')} ${S.ob === 1 ? 'Home' : 'Back'}</button><button class="btn btn-primary" data-ob="next">${S.ob === 1 ? 'Verify' : 'Continue'} ${ico('arrow')}</button></div>`;
  return `<section id="onboard" class="gutter screen"><div class="ob">

/* ── match ───────────────────────── */
function ringSvg(score) {
  const c = 2 * Math.PI * 28;
  return `<div class="score" aria-label="Match score ${score} percent"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="none" stroke="var(--surface-3)" stroke-width="6"/><circle cx="32" cy="32" r="28" fill="none" stroke="url(#mg)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - score / 100)}"/><defs><linearGradient id="mg"><stop offset="0" stop-color="var(--brand)"/><stop offset="1" stop-color="var(--accent)"/></linearGradient></defs></svg><b>${score}</b></div>`;
}
function match() {
  const cards = S.stack.slice().reverse().map((id) => {
    const a = ALUMNI.find((x) => x.id === id);
    return `<article class="mcard" data-card="${a.id}" aria-label="${esc(a.name)}, ${a.score}% match">
      <span class="stamp yes">REQUEST</span><span class="stamp no">SKIP</span>
      <div class="top">${av(a.name, 'av-lg', true)}${ringSvg(a.score)}</div>
      <div><h3>${esc(a.name)}</h3><p class="muted">${esc(a.role)} · ${esc(a.co)}</p><p class="mono" style="font-size:12px;color:var(--fg-3)">${a.branch} · Batch ${a.batch} · ${esc(a.langs)}</p></div>
      <div><span class="eyebrow">Why this match</span><ul class="why" style="margin-top:8px">${a.why.map((w) => `<li>${ico('check', 'i i-sm')}<span>${esc(w)}</span></li>`).join('')}</ul></div>
      <div style="margin-top:auto;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap">
        <div class="badges">${a.topics.map((x) => `<span class="tag">${esc(x)}</span>`).join('')}</div>
        <div style="display:flex;align-items:center;gap:8px"><span class="cap" aria-hidden="true">${Array.from({ length: a.cap }, (_, i) => `<i class="${i < a.slots ? 'on' : ''}"></i>`).join('')}</span><small class="mono muted" style="font-size:11px">${a.slots}/${a.cap} slots</small></div>
      </div></article>`;
  }).join('');
  return `<div class="sec-title"><h2>Alumni Match</h2><span class="mono muted" style="font-size:12px">${S.stack.length} left this week</span></div>
  <p class="muted" style="margin-top:-8px">Swipe right to request mentoring, left to skip. Or use the buttons or arrow keys. No cold DMs: chat opens only after a mentor accepts.</p>
  <div class="match-wrap">
    <div class="stack" id="stack" tabindex="0" aria-label="Mentor suggestions. Left arrow skips, right arrow requests.">${cards || `<div class="card empty" style="position:absolute;inset:0;align-content:center"><span class="ico">${ico('users')}</span><h3>You’ve seen everyone for this week</h3><p class="muted">New suggestions appear as alumni open request slots. Meanwhile, browse the directory.</p><button class="btn" data-reset-stack>Show them again</button></div>`}</div>
    ${S.stack.length ? `<div class="m-actions"><button class="btn round" data-swipe="left" aria-label="Skip">${ico('x')}</button><button class="btn btn-sm" data-go="mentor" data-mentor-top>View profile</button><button class="btn btn-primary round" data-swipe="right" aria-label="Request mentoring">${ico('heart')}</button></div>` : ''}
  </div>`;
}

/* ── galaxy ───────────────────────── */
const homeVB = () => (innerWidth < 640 ? { x: -330, y: -380, w: 660, h: 660 } : { x: -600, y: -600, w: 1200, h: 1200 });
function nodePos(n) { const r = ROADMAP.rings[n.ring].r; const a = (n.a * Math.PI) / 180; return [Math.cos(a) * r, Math.sin(a) * r]; }
function galaxy() {
  const done = ROADMAP.nodes.filter((n) => n.s === 'done').length;
  const total = ROADMAP.nodes.length;
  return `<div class="gal-head"><div><h2>Career Galaxy</h2><p class="muted" style="font-size:14px">Your path, from where you are to hired. Lit stars are done.</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <label class="sr-only" for="rmSel">Roadmap</label><select id="rmSel"><option>Backend engineer</option><option disabled>Data analyst (Phase 6)</option><option disabled>GATE · Mechanical (Phase 6)</option><option disabled>Core → IT switch (Phase 6)</option></select>
      <button class="btn btn-sm" data-galaxy-list aria-pressed="${S.galaxyList}">${ico(S.galaxyList ? 'galaxy' : 'list', 'i i-sm')} ${S.galaxyList ? 'Galaxy view' : 'List view'}</button>
    </div></div>
  <div class="progress-line"><div class="pbar" role="progressbar" aria-label="Roadmap progress" aria-valuenow="${done}" aria-valuemin="0" aria-valuemax="${total}"><i style="width:${(done / total) * 100}%"></i></div><span class="mono" style="font-size:13px">${done}/${total} · 2 in progress</span></div>
  ${S.galaxyList ? galaxyList() : `<div class="galaxy" id="galaxy"><canvas id="stars" aria-hidden="true"></canvas>${galaxySvg()}
    <div class="gal-legend" aria-hidden="true"><span><i style="background:var(--accent)"></i>Done</span><span><i style="border:2px solid var(--brand)"></i>In progress</span><span><i style="border:2px solid var(--fg-3)"></i>Ready</span><span><i style="border:2px dashed var(--line-strong)"></i>Locked</span></div>
    <div class="gal-ctrls"><button class="btn" data-zoom="in" aria-label="Zoom in">${ico('plus')}</button><button class="btn" data-zoom="out" aria-label="Zoom out">${ico('minus')}</button><button class="btn" data-zoom="reset" aria-label="Recenter">${ico('target')}</button></div></div>`}
  <div class="card node-panel" id="nodePanel" aria-live="polite">${nodePanel()}</div>
  <p class="demo-banner">${ico('info', 'i i-sm')} Placeholder roadmap for design review. Every node will carry cited sources and a “last reviewed” date after Phase 6 research.</p>`;
}
function galaxySvg() {
  if (!S.vb) S.vb = homeVB();
  const { x, y, w, h } = S.vb;
  const id = Object.fromEntries(ROADMAP.nodes.map((n) => [n.id, n]));
  const edges = ROADMAP.edges.map(([a, b]) => { const [x1, y1] = nodePos(id[a]); const [x2, y2] = nodePos(id[b]); const lit = id[a].s === 'done' && id[b].s !== 'locked'; return `<path class="edge ${lit ? 'lit' : ''}" d="M${x1},${y1} Q${(x1 + x2) * 0.42},${(y1 + y2) * 0.42} ${x2},${y2}"/>`; }).join('');
  const rings = ROADMAP.rings.map((r) => `<circle class="orbit" r="${r.r}"/><text class="orbit-label" x="0" y="${-r.r - 12}" text-anchor="middle">${r.label}</text>`).join('');
  const label = { done: 'done', doing: 'in progress', open: 'ready to start', locked: 'locked' };
  const nodes = ROADMAP.nodes.map((n) => { const [cx, cy] = nodePos(n); return `<g class="node ${n.s} ${S.galaxySel === n.id ? 'sel' : ''}" data-node="${n.id}" tabindex="0" role="button" aria-label="${esc(n.t)}, ${label[n.s]}" transform="translate(${cx},${cy})"><circle class="glow" r="${n.s === 'doing' ? 22 : 34}"/><circle class="core" r="20"/><text y="44">${esc(n.t)}</text></g>`; }).join('');
  return `<svg class="map" id="map" viewBox="${x} ${y} ${w} ${h}" preserveAspectRatio="xMidYMid meet" aria-label="Roadmap map. Use the list view for a text version.">${rings}${edges}<g class="you"><circle r="40"/><text y="5">You</text></g>${nodes}</svg>`;
}

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!root.dataset.theme) render(); });

/* ── boot ───────────────────────── */
root.dataset.tenant = S.tenant; root.lang = S.lang;
