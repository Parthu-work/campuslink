name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MONGODB_URI_TEST: mongodb://127.0.0.1:27017/?directConnection=true
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # API tests (incl. the mandatory tenant-isolation and permission suites) run against real
      # MongoDB. Started as a quiet step rather than a service, as in e2e: a service container prints
      # its whole log at teardown, which buries the test output. Kernels 6.19 to 7.0.13 (current
      # runners) make mongod refuse to start (SERVER-121912) unless glibc owns rseq.
      - name: Start MongoDB
        run: |
          docker run -d --name mongo -p 27017:27017 -e GLIBC_TUNABLES=glibc.pthread.rseq=1 mongo:8.0 --quiet
          for i in $(seq 1 40); do
            # HOME=/tmp: mongosh must not write into /data/db while the image's entrypoint chowns it
            # (the race left the container stopped: 'chown: cannot access /data/db/.mongodb/mongosh').
            docker exec -e HOME=/tmp mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' && exit 0
            sleep 2
          done
          docker logs mongo | tail -50
          exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Tenant isolation + permission suites (must pass; listed separately for visibility)
        run: pnpm --filter @campuslink/api exec vitest run test/isolation test/permissions.test.ts
      - name: API coverage (security-critical modules ≥ 80%)
        # The github-actions reporter turns any failing test into a readable annotation.
        run: pnpm --filter @campuslink/api exec vitest run --coverage --reporter=default --reporter=github-actions
      - run: pnpm build
      # Initial JS ≤ 170 KB gzip and a per-screen budget (master prompt §7d).
      - name: Bundle budget
        run: pnpm --filter @campuslink/web budget

  # The production adapters against real services: ClamAV (EICAR detection, fail-closed), an
  # S3-compatible store (SeaweedFS) and Qdrant (the vector-store contract, tenant filters included).
  # Images and versions match docker-compose.yml.
  adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        # Kernels 6.19 to 7.0.13 (current runners) make mongod refuse to start (SERVER-121912) unless
        # glibc owns rseq, which keeps tcmalloc off the affected kernel path.
        env:
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MONGODB_URI_TEST: mongodb://127.0.0.1:27017/?directConnection=true
      CLAMAV_TEST_ADDRESS: 127.0.0.1:3310
      S3_TEST_ENDPOINT: http://127.0.0.1:8333
      QDRANT_TEST_URL: http://127.0.0.1:6333
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start ClamAV, the S3-compatible store and Qdrant
        run: |
          docker compose --profile clamav --profile s3 --profile qdrant up -d --wait clamav s3 qdrant
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:6333/readyz && break; sleep 1; done
      - run: pnpm --filter @campuslink/shared build
      - run: pnpm --filter @campuslink/api exec vitest run test/clamav.test.ts test/s3-storage.test.ts test/vector-store.test.ts

  e2e:
    runs-on: ubuntu-latest
    # The suite alone takes about 20 minutes (230 tests, one worker); the browser download can add 10.
    timeout-minutes: 35
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      # e2e reads emailed verification codes through the Mailpit API.
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ['1025:1025', '8025:8025']
        options: --health-cmd "/mailpit readyz" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/campuslink_e2e?directConnection=true
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # MongoDB runs as a step rather than a service: a service container prints its whole log at
      # teardown, which buries Playwright's failure report. --quiet drops the connection chatter.
      # Kernels 6.19 to 7.0.13 (current runners) make mongod refuse to start (SERVER-121912) unless
      # glibc owns rseq, which keeps tcmalloc off the affected kernel path.
      - name: Start MongoDB
        run: |
          docker run -d --name mongo -p 27017:27017 -e GLIBC_TUNABLES=glibc.pthread.rseq=1 mongo:8.0 --quiet
          for i in $(seq 1 40); do
            # HOME=/tmp: mongosh must not write into /data/db while the image's entrypoint chowns it
            # (the race left the container stopped: 'chown: cannot access /data/db/.mongodb/mongosh').
            docker exec -e HOME=/tmp mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' && exit 0
            sleep 2
          done
          docker logs mongo | tail -50
          exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @campuslink/shared build
      - run: pnpm --filter @campuslink/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # The page snapshot of each failure in the log itself, readable without the artifact.
      - name: Print failure snapshots
        if: failure()
        run: find apps/web/test-results -name error-context.md -print -exec cat {} \; 2>/dev/null | head -c 200000 || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # The one-server production files (prompt 4, P2/P3/P9): the compose file resolves with generated
  # secrets, nginx accepts the edge template, and the deploy scripts pass shellcheck.
  deploy-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Scripts pass bash -n and shellcheck
        run: |
          for f in deploy/prod/*.sh scripts/backup/*.sh; do bash -n "$f"; done
          shellcheck --severity=error deploy/prod/*.sh
      - name: Compose file resolves with generated secrets
        run: |
          dir=$(mktemp -d)
          deploy/prod/gen-secrets.sh --domain campus.example --dir "$dir"
          # gen-secrets refuses to overwrite
          if deploy/prod/gen-secrets.sh --domain campus.example --dir "$dir"; then exit 1; fi
          cp -r "$dir/secrets" deploy/prod/secrets && cp "$dir/.env" deploy/prod/.env
          docker compose --project-directory deploy/prod -f deploy/prod/compose.yml --env-file "$dir/.env" config --quiet
          # Only the edge publishes ports.
          docker compose --project-directory deploy/prod -f deploy/prod/compose.yml --env-file "$dir/.env" config --format json |
            jq -e '[.services | to_entries[] | select(.value.ports != null) | .key] == ["edge"]'
      - name: nginx accepts the edge template
        run: |
          mkdir -p /tmp/edge/cloudflare /tmp/edge/tls
          printf 'geo $realip_remote_addr $from_edge { default 1; }\n' >/tmp/edge/cloudflare/origin-lock.conf
          : >/tmp/edge/cloudflare/real-ip.conf
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=campus.example \
            -keyout /tmp/edge/tls/privkey.pem -out /tmp/edge/tls/fullchain.pem 2>/dev/null
          docker run --rm -e APP_ROOT_DOMAIN=campus.example \
            -v "$PWD/deploy/nginx/campuslink.conf:/etc/nginx/templates/default.conf.template:ro" \
            -v /tmp/edge/cloudflare:/etc/nginx/cloudflare:ro -v /tmp/edge/tls:/etc/ssl/campuslink:ro \
            --add-host api:127.0.0.1 --add-host web:127.0.0.1 \
            nginx:1.28-alpine sh -c '/docker-entrypoint.d/20-envsubst-on-templates.sh && nginx -t'

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (production deps, high+)
        run: pnpm audit --prod --audit-level=high
      - name: Secret scanning (gitleaks pinned to the version used locally; full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact --no-banner
