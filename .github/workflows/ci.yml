name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # API tests (incl. the mandatory tenant-isolation and permission suites) run against real MongoDB.
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MONGODB_URI_TEST: mongodb://127.0.0.1:27017/?directConnection=true
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Tenant isolation + permission suites (must pass; listed separately for visibility)
        run: pnpm --filter @campuslink/api exec vitest run test/isolation test/permissions.test.ts
      - name: API coverage (security-critical modules ≥ 80%)
        run: pnpm --filter @campuslink/api exec vitest run --coverage
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      # e2e reads emailed verification codes through the Mailpit API.
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ['1025:1025', '8025:8025']
        options: --health-cmd "/mailpit readyz" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/campuslink_e2e?directConnection=true
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @campuslink/shared build
      - run: pnpm --filter @campuslink/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (production deps, high+)
        run: pnpm audit --prod --audit-level=high
      - name: Secret scanning (gitleaks pinned to the version used locally; full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact --no-banner
