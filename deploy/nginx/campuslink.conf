# Single-host setup: nginx terminates TLS and serves both the web app and /api for every college
# subdomain (<college>.campuslink.example, admin.campuslink.example). Replace campuslink.example
# with the real root domain (APP_ROOT_DOMAIN). Behind an AWS ALB, use web-container.conf instead
# (the ALB terminates TLS and routes /api/* to the API). See docs/deployment.md.

upstream campuslink_api {
  # One entry per API instance. No sticky sessions needed: Socket.io is websocket-only and
  # fans out through the Redis adapter (apps/api/src/server.ts).
  least_conn;
  server 127.0.0.1:4000;
  keepalive 32;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' '';
}

server {
  listen 80;
  listen [::]:80;
  server_name .campuslink.example;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name .campuslink.example;

  ssl_certificate /etc/ssl/campuslink/fullchain.pem;
  ssl_certificate_key /etc/ssl/campuslink/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:campuslink:10m;
  ssl_session_tickets off;

  server_tokens off;
  # Uploads are capped by the API (FilesService); this is only an outer bound.
  client_max_body_size 30m;
  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # API and Socket.io. The API sets its own CSP, HSTS, no-store and CORS headers.
  location /api/ {
    proxy_pass http://campuslink_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 75s;
  }

  # Study material uploads: videos up to 200 MB (the API enforces each type's own cap and scans
  # every file before storing it). Everything else keeps the 30 MB bound above.
  location ~ ^/api/v1/study/materials(/[a-f0-9]{24}/versions)?$ {
    client_max_body_size 210m;
    client_body_timeout 120s;
    proxy_pass http://campuslink_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 300s;
  }

  include /etc/nginx/snippets/campuslink-static.conf;
}
