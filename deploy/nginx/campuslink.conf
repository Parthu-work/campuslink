# The origin's edge (prompt 4, P3): nginx terminates TLS and routes every host of the platform:
# college hosts (<college>.${APP_ROOT_DOMAIN}), the platform host (admin.${APP_ROOT_DOMAIN}),
# employer hosts (emp-<name>.${APP_ROOT_DOMAIN}), the public pages (/p/...), the credential paths
# and /api (with the WebSocket upgrade) to the API; everything else to the web container.
#
# This file is a TEMPLATE: the nginx image fills in ${APP_ROOT_DOMAIN} at container start (envsubst
# on /etc/nginx/templates/*.template; only variables that exist in the container's environment are
# replaced, so nginx's own $variables stay as they are). deploy/prod/compose.yml mounts it; the
# staging rehearsal keeps its own deploy/staging/edge.conf. See docs/deploy-oracle.md.
#
# In front of it: Cloudflare (proxied DNS, "Full (strict)" with a Cloudflare Origin CA certificate
# here). Behind an AWS ALB, use web-container.conf instead (docs/deployment.md › Scale-up path).

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' '';
}

# The member's address. Cloudflare sends it in CF-Connecting-IP; it is believed only when the
# connection comes from one of Cloudflare's published ranges. Both files are generated by
# deploy/prod/cloudflare-ips.sh (weekly timer) and reloaded:
#   real-ip.conf      set_real_ip_from <range>; … real_ip_header CF-Connecting-IP;
#   origin-lock.conf  geo $realip_remote_addr $from_edge { default 0; <range> 1; … }
include /etc/nginx/cloudflare/real-ip.conf;
include /etc/nginx/cloudflare/origin-lock.conf;

# The access log keeps no personal data: no client address, no user agent, no referrer, and the
# path without its query string (reset and invite links carry tokens there). CLAUDE.md › Security.
log_format campuslink '$time_iso8601 $host "$request_method $uri" $status $body_bytes_sent $request_time';
access_log /dev/stdout campuslink;

# Docker's DNS: upstreams are looked up at request time, so a container that was replaced by a
# deploy is found at its new address without reloading nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

# Plain HTTP only redirects (Cloudflare reaches the origin on 443).
server {
  listen 8080 default_server;
  server_name _;
  server_tokens off;
  return 301 https://$host$request_uri;
}

# A TLS handshake for a name that is not ours is refused before any certificate is shown.
server {
  listen 8443 ssl default_server;
  server_name _;
  ssl_reject_handshake on;
}

server {
  listen 8443 ssl;
  http2 on;
  server_name .${APP_ROOT_DOMAIN};

  ssl_certificate /etc/ssl/campuslink/fullchain.pem;
  ssl_certificate_key /etc/ssl/campuslink/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:campuslink:10m;
  ssl_session_tickets off;

  server_tokens off;
  # Uploads are capped by the API (FilesService); this is only an outer bound.
  client_max_body_size 30m;

  # Defence in depth behind the firewall: a connection that did not come through the edge
  # (Cloudflare's ranges) is closed without an answer.
  if ($from_edge = 0) {
    return 444;
  }

  set $api http://api:4000;
  set $web http://web:8080;

  # Metrics are for the server itself (scraped inside the Docker network with METRICS_TOKEN).
  location = /api/v1/metrics {
    return 404;
  }

  # API and Socket.io. The API sets its own CSP, HSTS, no-store and CORS headers. X-Forwarded-For
  # is overwritten with the one address this server verified, so the API trusts exactly one hop
  # (TRUST_PROXY_HOPS=1) and never an address the client typed.
  location /api/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 75s;
  }

  # Public pages (prompt 2, G8): server-rendered by the API at /p/... so link previews work. The
  # API's own Cache-Control (five minutes) is what Cloudflare and browsers honour.
  location /p/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 30s;
  }

  # Verified credentials (prompt 2, G12): the verify page, the DID document and the status list,
  # served by the API at /{college}/... (the same pattern as the API's own route check).
  location ~ "^/[a-z][a-z0-9-]{1,30}[a-z0-9]/(verify/[A-Za-z0-9_-]{22}(\.jwt)?|did\.json|credentials/status/1)$" {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 30s;
  }

  # Study material uploads: videos up to 200 MB (the API enforces each type's own cap, the plan's
  # cap, and scans every file before storing it). Everything else keeps the 30 MB bound above.
  # Cloudflare's free plan refuses request bodies over 100 MB; the pilot plan caps study media at
  # 50 MB (PLAN_STORAGE), so the pilot never reaches either bound.
  location ~ "^/api/v1/study/materials(/[a-f0-9]{24}/versions)?$" {
    client_max_body_size 210m;
    client_body_timeout 120s;
    proxy_request_buffering off;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 300s;
  }

  # The web app: static files with the security headers and cache rules, from the web container
  # (deploy/nginx/static.conf): hashed assets for a year, HTML and the service worker never cached.
  location / {
    proxy_pass $web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
