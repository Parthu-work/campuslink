# The web container behind an AWS ALB: the ALB terminates TLS, redirects HTTP to HTTPS and routes
# /api/* straight to the API target group, so this server only serves the static build.
server {
  # IPv4 only: the ALB reaches tasks over IPv4, and some container networks have no IPv6.
  listen 8080;
  server_name _;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  include /etc/nginx/snippets/campuslink-static.conf;
}
