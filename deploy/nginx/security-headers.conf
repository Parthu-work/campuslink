# Security headers for the web app (static files). Included in every location that serves the
# SPA, because nginx drops server-level add_header lines in a location that sets its own.
# The API sets its own headers (helmet); do not include this in the /api location.
# Checked by apps/web/src/lib/security-headers.test.ts, and served by `vite preview` so the
# end-to-end suite runs under exactly this policy.
# challenges.cloudflare.com: the Turnstile human check (script and its iframe). It loads only when
# BOT_PROTECTION=turnstile and a protected write is challenged (apps/web/src/lib/bot-check.ts).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
