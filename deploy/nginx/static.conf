# The SPA's static files and their caching. Included by campuslink.conf and web-container.conf
# (install as /etc/nginx/snippets/campuslink-static.conf).
root /srv/campuslink/web;

# Hashed build output: cache for a year.
location /assets/ {
  include /etc/nginx/snippets/campuslink-security-headers.conf;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  try_files $uri =404;
}

# The service worker and manifest must be revalidated so updates reach members.
location ~ ^/(sw\.js|push-sw\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
  include /etc/nginx/snippets/campuslink-security-headers.conf;
  add_header Cache-Control "no-cache" always;
  try_files $uri =404;
}

# The SPA: every other path serves index.html, never cached.
location / {
  include /etc/nginx/snippets/campuslink-security-headers.conf;
  add_header Cache-Control "no-cache" always;
  try_files $uri /index.html;
}
