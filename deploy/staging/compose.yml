# Staging rehearsal: the production images, in production mode, with every production adapter
# against a real service. Run with scripts in this folder (see README.md), not by hand: up.sh
# generates the secrets and the TLS certificate this file expects.
#
#   edge (TLS, plays the AWS ALB) → web (nginx, static + headers)
#                                 → api (Node, NODE_ENV=production) → mongo, redis, clamav, s3, mailpit
name: campuslink-staging

x-api-env: &api-env
  NODE_ENV: production
  LOG_LEVEL: info
  APP_ROOT_DOMAIN: localhost
  WEB_ORIGIN: https://localhost:8443
  CORS_ALLOWED_ORIGINS: https://*.localhost:8443
  TRUST_PROXY_HOPS: '1'
  MONGODB_URI: mongodb://mongo:27017/campuslink?directConnection=true
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?run up.sh}
  JWT_TICKET_SECRET: ${JWT_TICKET_SECRET:?run up.sh}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?run up.sh}
  SMTP_HOST: mailpit
  SMTP_PORT: '1025'
  MAIL_FROM: CampusLink staging <no-reply@staging.localhost>
  MALWARE_SCANNER: clamav
  CLAMAV_ADDRESS: clamav:3310
  STORAGE_DRIVER: s3
  S3_BUCKET: campuslink-files
  S3_ENDPOINT: http://s3:8333
  S3_REGION: us-east-1
  # SeaweedFS does SSE-S3 (AES256) with the KEK below; AWS production uses aws:kms.
  S3_SSE: AES256
  S3_ACCESS_KEY_ID: staging
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?run up.sh}
  # No outbound network in a rehearsal.
  HIBP_ENABLED: 'false'
  INGESTION_ENABLED: 'false'

services:
  edge:
    image: nginx:1.28-alpine
    depends_on: [web, api]
    ports: ['127.0.0.1:8443:8443']
    volumes:
      - ./edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ${STAGING_CERT_DIR:?run up.sh}:/etc/ssl/staging:ro

  web:
    image: ${WEB_IMAGE:-campuslink-web:staging}

  api:
    image: ${API_IMAGE:-campuslink-api:staging}
    environment: *api-env
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      clamav: { condition: service_healthy }
      s3: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  mongo:
    image: mongo:8.0
    command: ['--replSet', 'rs0', '--bind_ip_all']
    # Kernels 6.19 to 7.0.13 make mongod refuse to start (SERVER-121912) unless glibc owns rseq.
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    # Published only so up.sh can seed DEMO data from the host.
    ports: ['127.0.0.1:27018:27017']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:''rs0'',members:[{_id:0,host:''localhost:27017''}]}).ok }"',
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  clamav:
    image: clamav/clamav:1.5.4
    environment:
      CLAMAV_NO_FRESHCLAMD: 'true'
      CLAMD_CONF_StreamMaxLength: 30M
    healthcheck:
      test: ['CMD-SHELL', 'clamdscan --ping 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  s3:
    image: chrislusf/seaweedfs:4.48
    command:
      ['server', '-dir=/data', '-s3', '-s3.port=8333', '-master.volumeSizeLimitMB=64', '-volume.max=100']
    environment:
      WEED_S3_SSE_KEK: ${S3_SSE_KEK:?run up.sh}
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.27
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20
