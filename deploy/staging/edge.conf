# Staging edge: terminates TLS and routes like the production ALB (docs/deployment.md):
# /api/* (and Socket.io) to the API, everything else to the web container.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' '';
}

server {
  listen 8443 ssl;
  server_name .localhost;
  ssl_certificate /etc/ssl/staging/fullchain.pem;
  ssl_certificate_key /etc/ssl/staging/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  client_max_body_size 30m;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host:8443;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 75s;
  }

  # Study material uploads (videos up to 200 MB), as in deploy/nginx/campuslink.conf.
  location ~ ^/api/v1/study/materials(/[a-f0-9]{24}/versions)?$ {
    client_max_body_size 210m;
    client_body_timeout 120s;
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host:8443;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
  }

  location / {
    proxy_pass http://web:8080;
    proxy_set_header Host $host;
  }
}
