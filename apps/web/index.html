<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9fafe" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0d12" />
    <script src="/boot.js"></script>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>%APP_NAME%</title>
  </head>
  <body>
    <div id="root">
      <!-- The launch mark, painted before any script runs; the app's Splash (app/guards.tsx) keeps it. -->
      <div class="launch"><img src="/icons/icon.svg" alt="" width="56" height="56" /></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
