# Local development infrastructure only. Ports bind to 127.0.0.1 so nothing is exposed on the LAN.
name: campuslink
services:
  mongo:
    image: mongo:8.0
    # Kernels 6.19 to 7.0.13 make mongod refuse to start (SERVER-121912) unless glibc owns rseq,
    # which keeps tcmalloc off the affected kernel path.
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    # Single-node replica set: required for multi-document transactions and change streams.
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports: ['127.0.0.1:27017:27017']
    volumes: [mongo-data:/data/db]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:''rs0'',members:[{_id:0,host:''localhost:27017''}]}).ok }"',
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['127.0.0.1:6379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional services for the production adapters. Start with:
  #   docker compose --profile clamav --profile s3 up -d --wait
  # ClamAV (MALWARE_SCANNER=clamav, CLAMAV_ADDRESS=127.0.0.1:3310). Signatures ship in the image;
  # freshclam stays off so it works offline. Loading signatures takes about a minute.
  clamav:
    image: clamav/clamav:1.5.4
    profiles: [clamav]
    environment:
      CLAMAV_NO_FRESHCLAMD: 'true'
      # Above the largest upload (200 MB study videos). Files over a limit are reported, not
      # skipped (AlertExceedsMax), so the API refuses them: scanning stays fail-closed.
      CLAMD_CONF_StreamMaxLength: 210M
      CLAMD_CONF_MaxFileSize: 210M
      CLAMD_CONF_MaxScanSize: 420M
      CLAMD_CONF_MaxScanTime: 170000
      CLAMD_CONF_AlertExceedsMax: 'yes'
    ports: ['127.0.0.1:3310:3310']
    healthcheck:
      test: ['CMD-SHELL', 'clamdscan --ping 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # S3-compatible object storage (STORAGE_DRIVER=s3, S3_ENDPOINT=http://127.0.0.1:8333).
  # Local only: no identities are configured, so any credentials are accepted.
  s3:
    image: chrislusf/seaweedfs:4.48
    profiles: [s3]
    command:
      ['server', '-dir=/data', '-s3', '-s3.port=8333', '-master.volumeSizeLimitMB=64', '-volume.max=100']
    ports: ['127.0.0.1:8333:8333']
    volumes: [s3-data:/data]
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Speech to text for study videos without captions (WHISPER_URL=http://127.0.0.1:9000). Runs on
  # the CPU; nothing leaves the machine. The first start downloads the model (about 150 MB).
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:v1.10.0
    profiles: [whisper]
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: base
    ports: ['127.0.0.1:9000:9000']
    volumes: [whisper-cache:/root/.cache]

volumes:
  mongo-data:
  redis-data:
  s3-data:
  whisper-cache:
